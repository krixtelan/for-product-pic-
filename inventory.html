<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7; /* Slightly softer */
        }
    
        .page-wrapper {
            display: flex;
            gap: 2rem;
            padding: 2rem;
            height: calc(100vh - 60px);
            box-sizing: border-box;
        }
    
        .form-container {
            flex: 0.35;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 16px; /* smoother curve */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); /* slightly stronger */
            transition: box-shadow 0.3s;
        }
    
        .form-container:hover {
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
        }
    
        .form-container h2 {
            margin-bottom: 1.5rem;
            color: #333;
        }
    
        .form-container form {
            display: flex;
            flex-direction: column;
        }
    
        .form-container input,
        .form-container button {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px; /* slightly rounder */
            font-size: 15px;
            transition: all 0.3s ease;
        }
    
        .form-container input:focus {
            border-color: #2980b9;
            outline: none;
            background-color: #f0f8ff;
        }
    
        .form-container button {
            background-color: #2980b9;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
    
        .form-container button:hover {
            background-color: #219150;
        }
    
        .table-container {
            flex: 1;
            overflow-x: auto;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: box-shadow 0.3s;
        }
    
        .table-container:hover {
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
        }
    
        .table-container h2 {
            margin-bottom: 1.5rem;
            color: #333;
        }
    
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
    
        th, td {
            text-align: left;
            padding: 0.9rem;
            border-bottom: 1px solid #eee;
        }
    
        th {
            background-color: #f9fafb;
            font-weight: 600;
            font-size: 15px;
        }
    
        td input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.3s ease;
        }
    
        td input:focus {
            border-color: #2980b9;
            outline: none;
            background-color: #f0f8ff;
        }
    
        td button {
            padding: 0.5rem 0.9rem;
            border: none;
            border-radius: 6px;
            margin-right: 5px;
            margin-top: 2px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
            width:80px;
            text-align: center;
        }
    
        td button[type="submit"] {
            background-color: #2980b9;
            color: white;
        }
    
        td button[type="submit"]:hover {
            background-color: #216a94;
        }
    
        td button[type="button"] {
            background-color: #dc3545;
            color: white;
        }
    
        td button[type="button"]:hover {
            background-color: #c82333;
        }
    </style>
    
</head>
<body>
    <div class="header-wrapper">
    <header>
        <button id="menuButton">☰</button>
        <h1>VIVOS MEDICAL SUPPLIES TRADING</h1>
        <nav id="menu" class="hidden">
            <ul>
              <li><a href="{{ url_for('home') }}">Home</a></li>
              <li><a href="{{ url_for('inventory') }}">Inventory</a></li>
              <li><a href="{{ url_for('sales') }}">Report</a></li>
              <li><a href="{{ url_for('about') }}">Order History</a></li>
            </ul>
        </nav>
    
        <div class="account-menu">
            <img src="{{ url_for('static', filename='redicon.jpg') }}" alt="User" class="user-icon" id="userIcon">
            <div class="dropdown-menu" id="dropdownMenu">
              <p id="userRole" class="label">MICHELLE VIVOS</p>
              <hr>
             
              <a href="#" onclick="showOverlay('changePasswordOverlay')">Change Password</a>
              <a id="logoutBtn">Logout</a>
            </div>
          </div>
           
        <!-- Overlay for Change Password -->
        <div id="changePasswordOverlay" class="overlay hidden">
          <div class="overlay-content">
            <h3>Change Password</h3>
            <input type="password" placeholder="Current Password">
            <input type="password" placeholder="New Password">
            <input type="password" placeholder="Confirm Password">
            <button onclick="updatePassword()">Update</button>
            <button onclick="closeOverlay('changePasswordOverlay')">Cancel</button>
          </div>
        </div>
    </header>
    </div>

    <div class="page-wrapper">
    <div class="form-container">
        <h2>Add Product</h2>
        <form action="/add_item" method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="number" step="0.01" name="market_price" placeholder="Market Price" required>
            <input type="number" step="0.01" name="shop_price" placeholder="Shop Price" required>
            <input type="number" name="quantity" placeholder="Quantity" required>
            <button type="submit">Add Product</button>
        </form>
    </div>

    <div class="table-container">
        <h2>Product List</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Market Price</th>
                    <th>Shop Price</th>
                    <th>Quantity</th>
                    <th>Stock Purchased</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <form action="/edit_item/{{ item.id }}" method="POST">
                        <td><input type="text" name="name" value="{{ item.name }}" required></td>
                        <td><input type="number" step="0.01" name="market_price" value="{{ item.market_price }}" required></td>
                        <td><input type="number" step="0.01" name="shop_price" value="{{ item.shop_price }}" required></td>
                        <td><input type="number" name="quantity" value="{{ item.quantity }}" required></td>
                        <td><input type="number" name="stock_purchased" placeholder="0 (optional)"></td>
                        <td>
                            <button type="submit">Update</button>
                            <button type="button" onclick="deleteItem('{{ item.id }}')">Delete</button>
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    </div>
    <script src="{{ url_for('static', filename='menubutton.js') }}"></script>

</body>

</html>
